name: Validate Creators Common Registry

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-registry.yml"
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "schemas/**"
      - "examples/**"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-registry.yml"

permissions:
  contents: read

concurrency:
  group: creators-common-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate schemas and linked examples
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies and validate
        run: |
          python3 -m pip install --quiet --disable-pip-version-check -r requirements-dev.txt
          python3 tools/validate_registry.py
