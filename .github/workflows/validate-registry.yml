name: Validate Creators Common Registry

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-registry.yml"
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "schemas/**"
      - "examples/**"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-registry.yml"

permissions:
  contents: read

concurrency:
  group: creators-common-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-registry:
    name: Validate schemas and linked examples
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate schemas and records
        run: python tools/validate_registry.py
